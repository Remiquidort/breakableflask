name: Automatisation des tests DevSecOps

on:
  push:

jobs:
  Dependances:
    name: Contrôle des dépendances Python
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Scanner requirements.txt avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "1"

  Dockerfile:
    name: Contrôle du Dockerfile
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Scanner le Dockerfile avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          exit-code: "1"

  Deploy:
    name: Étape de déploiement simulée
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: echo "Rien à faire ici. Votre application est prête à être déployée"
